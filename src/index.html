<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'">
<title>GODAL OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  
  --page:#e9e8f2;--page-ink:#2a2840;--page-mute:#6c6a85;--chip:#fff;--chip-on:#5a6eff;
  --bg:#070617;--panel:#0f0c27;--panel2:#181440;--line:#272257;--ink:#f1f0ff;--mute:#8e8ab8;
  --a:#4f6bff;--b:#b04dff;--glow:#2fc6ff;--ok:#3ddc97;--warn:#ffb84d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Segoe UI",system-ui,sans-serif;height:100vh;overflow:hidden;user-select:none}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.win{width:100vw;height:100vh;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.tb{height:34px;flex:none;display:flex;align-items:center;gap:10px;padding-left:12px;background:#04030e;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute);-webkit-app-region:drag}
.tb img{width:18px;height:auto}
.tb .ctl{margin-left:auto;display:flex;height:100%;-webkit-app-region:no-drag}
.tb .ctl button{all:unset;width:46px;display:grid;place-items:center;font-size:13px;cursor:pointer;color:var(--mute)}
.tb .ctl button:hover{background:var(--panel2);color:var(--ink)}
.tb .ctl button:last-child:hover{background:#e5384b;color:#fff}
.body{flex:1;display:flex;min-height:0}
.side{width:216px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 12px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 26px}
.brand img{width:46px;height:auto;filter:drop-shadow(0 0 10px rgba(79,107,255,.7))}
.brand b{display:block;font:700 21px "Chakra Petch","Segoe UI",sans-serif;letter-spacing:.04em;line-height:1;background:linear-gradient(90deg,#7f95ff,#d58bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;margin-top:5px;font-size:11px;color:var(--mute)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;font:600 14px Manrope,sans-serif;color:var(--mute);cursor:pointer;border-left:3px solid transparent}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--glow)}
.nav button[aria-current="page"]{background:var(--panel2);color:var(--ink);border-left-color:var(--glow)}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hw{margin-top:20px;padding:0 8px}.hh{font:600 12px "Chakra Petch",sans-serif;color:var(--glow);margin-bottom:9px}.hi{margin-bottom:10px}.hi .t{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}.hi .t b{color:var(--ink);font:600 11px "Chakra Petch",sans-serif}.hi .nm{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0 4px}.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--b));transition:width .6s}.os{font-size:12px;color:var(--mute)}.os b{color:var(--ink);font-weight:600}
.who{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.who b{display:block;color:var(--ink);font-size:14px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:22px 26px 20px;gap:18px}
.ia{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--glow);border-radius:10px;font-size:14px;min-height:46px}
.ia b{font:600 12px "Chakra Petch",sans-serif;color:var(--glow);white-space:nowrap}
.cols{flex:1;min-height:0;display:flex;gap:22px}
.left{width:340px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 38%,#1c1660 0,var(--panel) 62%);border:1px solid var(--line);border-radius:12px;padding:22px}
.core{position:relative;width:232px;height:232px;display:grid;place-items:center}
.core svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.core circle{fill:none;stroke-width:6}
.core .bg{stroke:var(--line)}
.core .fg{stroke:url(#g);stroke-linecap:round;stroke-dasharray:703.7;stroke-dashoffset:703.7;transition:stroke-dashoffset .35s}
.core img{width:150px;height:auto;filter:drop-shadow(0 0 22px rgba(79,107,255,.75));animation:fl 4s ease-in-out infinite}
.core.work img{animation:fl 1.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-7px)}}
.pc{text-align:center;margin-top:-4px}
.pc b{font:700 34px "Chakra Petch",sans-serif;line-height:1}
.pc span{display:block;font-size:13px;color:var(--mute);margin-top:4px}
.btn{all:unset;box-sizing:border-box;width:100%;text-align:center;padding:14px;border-radius:10px;font:700 16px "Chakra Petch",sans-serif;letter-spacing:.03em;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 24px rgba(79,107,255,.35)}
.btn:hover{filter:brightness(1.12)}
.btn:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.btn[disabled]{filter:grayscale(.7) brightness(.7);cursor:default;box-shadow:none}
.emu{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:13px}
.emu .d{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.emu em{margin-left:auto;font-style:normal;color:var(--mute);font-size:12px}
.right{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font:600 15px "Chakra Petch",sans-serif}
.rh span{font:500 12px Manrope,sans-serif;color:var(--mute)}
.list{flex:1;min-height:0;overflow:hidden;padding:6px 18px 12px}
.g{margin:14px 0 4px;font:600 12px "Chakra Petch",sans-serif;color:var(--glow)}
.row{display:flex;align-items:center;gap:12px;height:36px;border-bottom:1px solid #1e1a47;font-size:14px;color:var(--mute)}
.row.on,.row.done{color:var(--ink)}
.row .n{margin-left:auto;font-size:12px;color:var(--mute);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.row.on .dot{border-color:var(--glow);border-top-color:transparent;animation:sp .7s linear infinite}
.row.done .dot{border:0;background:var(--ok)}
.row.warn .dot{background:var(--warn)}.row.skip .dot{background:var(--mute)}
.bd{font:700 11px Manrope,sans-serif;padding:3px 9px;border-radius:5px;min-width:78px;text-align:center}
.bd.ok{background:#0f3a2b;color:var(--ok)}.bd.warn{background:#4a3410;color:var(--warn)}.bd.skip{background:#272257;color:var(--mute)}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.row.on .dot,.core img{animation:none}.core .fg{transition:none}}
.stats{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.st{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.st span{font-size:12px;color:var(--mute)}
.st b{display:block;margin-top:4px;font:600 22px "Chakra Petch",sans-serif}
.row.fail .dot{background:#ff5d6c}.bd.fail{background:#4a1520;color:#ff6b7a}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

.term{flex:none;height:30%;min-height:110px;max-height:180px;position:relative;background:#02010a;border-top:1px solid var(--line);display:flex;flex-direction:column;font:12px/1.6 "Cascadia Mono",Consolas,"Courier New",monospace}
.term::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(47,198,255,.035) 0 1px,transparent 1px 3px)}
.th{display:flex;align-items:center;gap:6px;padding:7px 14px;border-bottom:1px solid #15123a;color:var(--mute);font-size:11px}
.th i{width:9px;height:9px;border-radius:50%;background:#2c2760}.th i:first-child{background:#ff5d6c}.th i:nth-child(2){background:var(--warn)}.th i:nth-child(3){background:var(--ok)}
.th span{margin-left:8px}.th em{margin-left:auto;font-style:normal;color:var(--ok)}
.tl{flex:1;overflow-y:auto;padding:8px 14px;color:#b9b5ec;user-select:text}
.tl .t{color:#4d4990}.tl .ok{color:var(--ok)}.tl .wr{color:var(--warn)}.tl .er{color:#ff6b7a}.tl .ia{color:#c98bff}.tl .cmd{color:var(--glow)}
.pr{color:var(--ok)}.pr .p{color:var(--glow)}.cur{display:inline-block;width:7px;height:13px;background:var(--glow);vertical-align:-2px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
.hint{color:var(--mute);font-size:13px;padding:14px 0}
@keyframes rin{from{opacity:0;transform:translateX(-10px)}}.row,.g{animation:rin .25s ease-out}
@media (prefers-reduced-motion:reduce){.row,.g{animation:none}}

.row>span:nth-child(2){flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n{flex:0 1 auto;max-width:150px}.bd{flex:none}
.left{overflow:hidden}
@media (max-height:720px){.core{width:176px;height:176px}.core img{width:112px}.left{gap:10px;padding:14px}.pc b{font-size:28px}.btn{padding:11px}.emu{padding:8px 12px}.main{gap:14px;padding:18px 24px 16px}.st{padding:9px 14px}.st b{font-size:19px}.hw{margin-top:12px}.hi{margin-bottom:7px}.brand{padding-bottom:18px}}
@media (max-width:1040px){.left{width:290px}.row .n{display:none}.bd{min-width:60px;font-size:10px}.row{font-size:13px;gap:10px}}
</style>
</head>
<body>
<div class="win" id="win">
  <div class="tb"><img src="img/robo.png" alt="">GODΛL OS<div class="ctl"><button id="wmin" aria-label="Minimizar">–</button><button id="wmax" aria-label="Maximizar">□</button><button id="wclose" aria-label="Fechar">✕</button></div></div>
  <div class="body">
    <aside class="side">
      <div class="brand"><img src="img/robo.png" alt=""><div><b>GODΛL OS</b><small>Emulador Optimizer</small></div></div>
      <nav class="nav" id="nav">
        <button data-v="opt" aria-current="page"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Otimizar</button>
        <button data-v="rest"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Restaurar</button>
      </nav>
      <div class="hw"><div class="hh">Hardware do seu PC</div><div id="hw"></div><div class="os"><b id="os">Windows</b></div></div>
      <div class="who"><b id="who">Olá</b>Administrador</div>
    </aside>

    <section class="main">
      <div class="ia"><b>✦ GODAL IA</b><span id="msg"></span></div>
      <div class="cols">
        <div class="left">
          <div class="core" id="core">
            <svg viewBox="0 0 240 240"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fc6ff"/><stop offset="1" stop-color="#b04dff"/></linearGradient></defs>
              <circle class="bg" cx="120" cy="120" r="112"/><circle class="fg" id="fg" cx="120" cy="120" r="112"/></svg>
            <img src="img/robo.png" alt="GODAL IA">
          </div>
          <div class="pc"><b id="pct">0%</b><span id="lbl"></span></div>
          <div class="emu" id="emu"><i class="d"></i><span id="emun">Emulador</span><em id="emus">detecta ao iniciar</em></div>
          <button class="btn" id="go"></button>
        </div>
        <div class="right">
          <div class="rh"><span style="font:600 15px 'Chakra Petch',sans-serif;color:var(--ink)" id="rt"></span><span id="cnt"></span></div>
          <div class="list" id="list"></div>
          <div class="term"><div class="th"><i></i><i></i><i></i><span>godal-shell — administrador</span><em>● ao vivo</em></div><div class="tl" id="tl"><div id="tlines"></div><div class="pr"><span class="p">godal@pc</span>:~# <span class="cur"></span></div></div></div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </section>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
